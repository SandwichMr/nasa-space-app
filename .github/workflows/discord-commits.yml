name: Discord · commits en main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publicar commits reales en Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_COMMITS_WEBHOOK }}
        shell: bash
        run: |
          python3 - <<'PY'
          """Notify Discord of real commits only; executed inline by GitHub Actions."""
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path


          def request_json(url, token=None, payload=None):
              headers = {'User-Agent': 'SpaceApps-Commit-Notifier/1.0', 'Accept': 'application/vnd.github+json'}
              if token:
                  headers['Authorization'] = 'Bearer ' + token
                  headers['X-GitHub-Api-Version'] = '2022-11-28'
              data = None
              if payload is not None:
                  data = json.dumps(payload, ensure_ascii=False).encode()
                  headers['Content-Type'] = 'application/json'
                  headers['Accept'] = 'application/json'
              for attempt in range(5):
                  try:
                      req = urllib.request.Request(url, data=data, headers=headers)
                      with urllib.request.urlopen(req, timeout=30) as res:
                          return json.load(res)
                  except urllib.error.HTTPError as exc:
                      if exc.code == 429:
                          try:
                              delay = float(json.loads(exc.read()).get('retry_after', 2))
                          except (ValueError, KeyError):
                              delay = 2
                          time.sleep(min(max(delay, 1), 60))
                          continue
                      # Do not expose token-bearing webhook URLs in errors.
                      raise RuntimeError(f'Remote service returned HTTP {exc.code}') from None
                  except urllib.error.URLError:
                      # A webhook POST may already have succeeded: never blindly repost.
                      raise RuntimeError('Network failure; inspect delivery before retrying') from None
              raise RuntimeError('Rate limit retry budget exhausted')


          def changed_files(repo, sha, token):
              result = None
              files = []
              page = 1
              while True:
                  data = request_json(f'https://api.github.com/repos/{repo}/commits/{sha}?per_page=100&page={page}', token=token)
                  if result is None:
                      result = data
                  batch = data.get('files', [])
                  files.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              result['files'] = files
              return result


          def build_payload(repo, commit):
              sha = commit['sha']
              details = commit['commit']
              subject, _, body = details['message'].partition('\n')
              author = details.get('author') or {}
              linked_author = commit.get('author') or {}
              name = author.get('name') or linked_author.get('login') or 'Autor no indicado'
              login = linked_author.get('login')
              if login and login != name:
                  name += f' (@{login})'
              filenames = []
              for item in commit.get('files', []):
                  label = {'added': '+', 'removed': '−', 'modified': '~', 'renamed': '→'}.get(item.get('status'), '•')
                  # Keep Markdown delimiters/newlines in file paths from damaging formatting.
                  filename = item['filename'].replace('`', "'").replace('\n', ' ')
                  filenames.append(f'{label} `{filename}`')
              visible = []
              size = 0
              for filename in filenames:
                  if size + len(filename) + 1 > 850:
                      break
                  visible.append(filename)
                  size += len(filename) + 1
              omitted = len(filenames) - len(visible)
              file_text = '\n'.join(visible) or 'Sin cambios de archivos informados por GitHub.'
              if omitted:
                  file_text += f'\n… y {omitted} archivo(s) más; consulta el commit.'
              body = body.strip()
              description = body[:1800] if body else 'Este commit no incluye una descripción adicional.'
              if len(body) > 1800:
                  description += '\n… descripción completa en el enlace.'
              return {
                  'username': 'GitHub · main',
                  'allowed_mentions': {'parse': []},
                  'embeds': [{
                      'title': (subject or sha[:7])[:230],
                      'url': f'https://github.com/{repo}/commit/{sha}',
                      'description': description,
                      'color': 0x087F89,
                      'fields': [
                          {'name': 'Autor', 'value': name[:256], 'inline': True},
                          {'name': 'Rama', 'value': 'main', 'inline': True},
                          {'name': f'Cambios · {len(filenames)} archivo(s)', 'value': file_text[:1024], 'inline': False},
                      ],
                      'footer': {'text': f'{repo} · {sha[:7]}'},
                  }],
              }


          def commit_ids(event, event_name, ref, sha):
              if ref != 'refs/heads/main' or event.get('deleted'):
                  return []
              if event_name == 'workflow_dispatch':
                  candidates = [sha]
              elif event_name == 'push':
                  candidates = [item['id'] for item in event.get('commits', [])]
                  if not candidates and event.get('after') and event.get('before', '').strip('0') == '':
                      candidates = [event['after']]
              else:
                  return []
              result = list(dict.fromkeys(candidates))
              if not all(re.fullmatch(r'[0-9a-f]{40}', value) for value in result):
                  raise RuntimeError('Unexpected commit SHA format')
              return result


          def main():
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              repo = os.environ['GITHUB_REPOSITORY']
              if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo):
                  raise RuntimeError('Unexpected repository format')
              ids = commit_ids(event, os.environ['GITHUB_EVENT_NAME'], os.environ['GITHUB_REF'], os.environ['GITHUB_SHA'])
              if not ids:
                  print('No new main commits to notify.')
                  return
              hook = os.environ.get('DISCORD_WEBHOOK_URL', '')
              parts = urllib.parse.urlsplit(hook)
              if parts.scheme != 'https' or parts.netloc != 'discord.com' or not re.fullmatch(r'/api/webhooks/\d+/[A-Za-z0-9_.-]+', parts.path) or parts.query:
                  raise RuntimeError('Configure the DISCORD_COMMITS_WEBHOOK repository secret')
              for sha in ids:
                  commit = changed_files(repo, sha, os.environ['GH_TOKEN'])
                  assert commit['sha'] == sha
                  response = request_json(hook + '?wait=true', payload=build_payload(repo, commit))
                  if not response.get('id'):
                      raise RuntimeError('Discord did not return a message identifier')
                  print(f'Commit {sha}: Discord message {response["id"]}')
              print(f'Delivered {len(ids)} real commit notification(s).')


          if __name__ == '__main__':
              main()
          PY
